[project]
name = "smart-ai-packing"
version = "1.0.0"
description = "PackSmart AI — Food Packaging Decision-Support System (SIH 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.1.0",
    "requests>=2.31.0",
    "supabase>=2.3.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9"
]

[tool.vercel]
entrypoint = "backend.main:app"
